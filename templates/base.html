<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookRecommender AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <h1>BookRecommender AI</h1>
            <p>Найди свою следующую любимую книгу с искусственным интеллектом</p>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
